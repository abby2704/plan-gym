<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1D4ED8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{-webkit-text-size-adjust:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Plan Full Body</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  /* Cuaderno de entrenamiento sobre piso de gimnasio: grises de hormigón; los colores de los discos olímpicos marcan el estado (azul = acción, verde = hecho, amarillo = propuesta o récord, rojo = borrar). */
  --bg:#E8EBEF; --surface:#FFFFFF; --surface2:#F1F3F6; --fg:#11151B; --muted:#586272; --line:#D3D9E0;
  --blue:#1D4ED8; --on-blue:#FFFFFF; --yellow-ink:#8A6100; --green:#0F6B35; --green-bg:#DCF2E4; --yellow:#D99A00; --yellow-bg:#FFEFB8; --red:#B92B2B; --red-bg:#FBE1DF;
  --font-head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1217; --surface:#171C23; --surface2:#1F252E; --fg:#EAEEF3; --muted:#98A3B1; --line:#2A313C;
    --blue:#6B93FF; --on-blue:#0A1020; --yellow-ink:#F2C230; --green:#4CC37E; --green-bg:#16301F; --yellow:#F2C230; --yellow-bg:#3A2F0B; --red:#F27067; --red-bg:#3B1B19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#171C23; --surface2:#1F252E; --fg:#EAEEF3; --muted:#98A3B1; --line:#2A313C;
  --blue:#6B93FF; --on-blue:#0A1020; --yellow-ink:#F2C230; --green:#4CC37E; --green-bg:#16301F; --yellow:#F2C230; --yellow-bg:#3A2F0B; --red:#F27067; --red-bg:#3B1B19;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--font-body);
  padding-block:16px calc(max(var(--dock-h,0px),84px) + 48px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-head);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:36px;line-height:1.02;text-transform:uppercase}
h2{font-size:22px;line-height:1.1;text-transform:uppercase}
h3{font-size:21px;line-height:1.15}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font:600 12px/1.2 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:4px}
.note{font-size:14px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.empty{align-items:flex-start}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 16px/1 var(--font-body);min-height:46px;padding:0 16px;border-radius:10px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--fg);background:transparent}
.btn.primary{background:var(--blue);color:var(--on-blue)}
.btn.secondary{background:var(--surface);border-color:var(--line)}
.btn.ghost{color:var(--muted)}
.btn.danger,.btn.armed{color:var(--red)}
.btn.armed{background:var(--red-bg);border-color:var(--red)}
.btn.block{width:100%}
.btn.lg{min-height:54px;font-size:18px}
.btn.sm{min-height:38px;padding:0 12px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tag{font:600 11px/1 var(--font-body);letter-spacing:.07em;text-transform:uppercase;padding:5px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.next{color:var(--blue);border-color:var(--blue)}
.tag.ok{color:var(--green);border-color:var(--green);background:var(--green-bg)}
.tag.mine{background:var(--yellow-bg);border-color:var(--yellow);color:var(--fg)}
.tag.coach{color:var(--blue);border-color:var(--blue)}
.tag.ss{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.tag.anc{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.sub{font-size:14px;color:var(--muted)}
.tgt{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tgt span{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:72px}
.tgt small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tgt b{display:block;font-family:var(--font-head);font-size:24px;font-weight:700;line-height:1.1;color:var(--fg)}
.how{margin-top:6px;font-size:14px}.how summary{cursor:pointer;color:var(--blue);padding:6px 0}
.how p{display:flex;gap:16px;margin:4px 0 0}.how a{color:var(--blue);font-weight:600}
.xnote{font-size:14px;color:var(--muted)}

.planchip{font:600 14px/1 var(--font-body);min-height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--blue);cursor:pointer;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.plancard.last{border-color:var(--blue)}
.card.next{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.card.rest{background:var(--surface2);box-shadow:none}.card.rest h3{color:var(--muted)}
.wbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding:8px 0 6px;margin:-4px 0 0}
.wtop{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}.wtop b{color:var(--fg);font-size:16px}
.wtrack{height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:6px}.wtrack i{display:block;height:100%;background:var(--green);transition:width .25s}
.ex{scroll-margin-top:84px}.ex.alldone{opacity:.62}.ex.alldone .exh h3::after{content:" ✓";color:var(--green)}
.addx .row .btn{flex:1}
.pills{display:grid;grid-template-columns:repeat(var(--cols,7),minmax(0,1fr));gap:4px}
.pill{min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:700 20px/1 var(--font-head);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.pill small{font:600 9px/1 var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pill.done{border-color:var(--green);background:var(--green-bg)}
.pill[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.pill[aria-pressed="true"] small{color:var(--on-blue)}

.rhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exlist{font-size:15px;color:var(--muted)}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lines li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.lines li>span:last-child{color:var(--muted);text-align:right;max-width:46%}
.lines li:first-child{border-top:0}
.gl{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;background:var(--blue);color:var(--on-blue);font:700 13px var(--font-head);margin-right:6px}
.cue{border-left:4px solid var(--blue);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:4px}
.cue.mine{border-left-color:var(--yellow)}
.kv{display:flex;gap:8px;flex-wrap:wrap}
.kv span{font:600 13px var(--font-body);background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:5px 8px}

.ex .exh{display:flex;flex-direction:column;gap:2px}
.ex .last{font-size:14px;color:var(--muted)}
.shead,.srow{display:grid;grid-template-columns:26px 1fr 14px 1fr 52px;gap:8px;align-items:center}
.shead{font:600 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.shead.nokg,.srow.nokg{grid-template-columns:26px 1fr 52px}
.srow{padding:4px;border-radius:10px;margin:0 -4px}
.srow.done{background:var(--green-bg)}
.sn{font:600 16px var(--font-head);color:var(--muted);text-align:center}
.x{text-align:center;color:var(--muted)}
.num,.txt{width:100%;min-width:0;min-height:46px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font:600 20px/1 var(--font-head);padding:0 10px;text-align:center;font-variant-numeric:tabular-nums}
.txt{font:500 16px/1.2 var(--font-body);text-align:left}
.pvset{margin-top:10px}.pvrow{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:16px}.pvrow span{color:var(--muted)}.pvrow b{font:700 18px var(--font-head)}
textarea.txt{resize:none;min-height:64px;padding:10px 12px;line-height:1.35;display:block}
.srow.done .num{background:var(--surface);color:var(--green)}
.chk{width:52px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.srow.done .chk{background:var(--green);border-color:var(--green);color:var(--surface)}
.exa{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font:600 12px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sel{width:100%;min-height:46px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font:500 16px var(--font-body);padding:0 10px}
.addex{display:flex;gap:8px}
.addex .txt{flex:1}
.alt{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.alt .it{display:flex;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.alt .it:first-of-type{border-top:0;padding-top:0}
.alt .it div{min-width:0}

.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:600 14px var(--font-body);min-height:36px;padding:0 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.stats div{display:flex;flex-direction:column;gap:2px;padding:0 10px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0;padding-left:0}
.stats b{font:700 30px/1 var(--font-head);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--muted);font:500 11px var(--font-body)}
.chart .ln{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--blue);stroke-width:2}
.chart .pt.pr{fill:var(--yellow);stroke:var(--fg)}
.chart .pt.last{fill:var(--blue)}
.chart .bar{fill:var(--blue);opacity:.35}
.chart .bar.cur{opacity:1}
.chart .val{fill:var(--fg);font:600 12px var(--font-body);text-anchor:middle}
.legend{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--yellow);border:1.5px solid var(--fg);display:inline-block}
.hrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.hrow:first-child{border-top:0}
.hrow span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.hist{display:flex;flex-direction:column}
.hist .item{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:8px}
.hist .item:first-child{border-top:0}
.hist .hd{display:flex;justify-content:space-between;gap:10px;align-items:center;background:none;border:0;color:var(--fg);text-align:left;padding:0;cursor:pointer;font-size:16px;width:100%}
.hist .hd small{color:var(--muted);font-size:14px;display:block}
.pr-list{display:flex;flex-direction:column;gap:8px}
.pr{display:flex;gap:10px;align-items:flex-start;background:var(--yellow-bg);border:1px solid var(--yellow);border-radius:10px;padding:10px 12px;font-size:15px}
.pr b{font-weight:600}
.ai-out{white-space:pre-wrap;font-size:16px;line-height:1.5}
.err{color:var(--red);font-size:15px}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.big div{background:var(--surface2);border-radius:10px;padding:10px 4px}
.big b{display:block;font:700 28px/1 var(--font-head);font-variant-numeric:tabular-nums}
.big span{font-size:12px;color:var(--muted)}

.logic{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:l}
.logic li{counter-increment:l;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:15px}
.logic li::before{content:counter(l);font:700 18px/1 var(--font-head);width:28px;height:28px;border-radius:7px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center}
.logic b{font-weight:600}
.chain{display:flex;flex-direction:column}
.chain .r{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:4px;font-size:15px}
.chain .r:first-child{border-top:0}
.chain .r>b{font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chain .r span{display:grid;grid-template-columns:48px 1fr;gap:8px}
.chain .r span i{font:600 12px/1.6 var(--font-body);font-style:normal;color:var(--muted)}
.chain .r span.p i{color:var(--yellow-ink)}

#dock{position:fixed;left:0;right:0;bottom:0;z-index:20}
.timer{background:var(--surface);border-top:3px solid var(--blue);padding-top:10px;padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.timer.done{border-top-color:var(--green);background:var(--green-bg)}
.tmain{display:flex;flex-direction:column;grid-row:1}
.tlabel{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tleft{font:700 38px/1 var(--font-head);font-variant-numeric:tabular-nums}
.tbtn{display:flex;gap:6px;justify-content:flex-end}
.tbtn button{min-height:40px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 15px var(--font-body);cursor:pointer}
.tbar{grid-column:1/-1;height:6px;background:var(--surface2);border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--blue)}
.timer.done .tbar i{background:var(--green)}
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs button{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12px var(--font-body);letter-spacing:.04em;min-height:50px;cursor:pointer;border-radius:8px}
.tabs button[aria-current="page"]{color:var(--blue)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock-h,84px) + 12px);max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:380px){h1{font-size:30px}.stats b{font-size:26px}}
</style>

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="dock"></div>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var pad=function(n){return String(n).padStart(2,"0")};
var dkey=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var num=function(v){var x=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(x)?x:null};
var fmt=function(n){return (n==null||!isFinite(n))?"–":String(Math.round(n*10)/10).replace(".",",")};
var kgS=function(n){return String(Math.round(n*100)/100).replace(".",",")};
var norm=function(s){return String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ")};
var e1=function(kg,r){return kg>0&&r>0?(r===1?kg:kg*(1+r/30)):0};
var sum=function(a){return a.reduce(function(x,y){return x+y},0)};
var fdate=function(k){var p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("es-UY",{day:"numeric",month:"short"}).replace(".","")};
var weekStart=function(d){d=d||new Date();var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
var mmss=function(s){return Math.floor(s/60)+":"+pad(s%60)};
var elapsed=function(t){var s=Math.max(0,Math.floor((Date.now()-t)/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+":"+pad(m)+":"+pad(s%60):m+":"+pad(s%60)};
var hhmm=function(t){return new Date(t).toLocaleTimeString("es-UY",{hour:"2-digit",minute:"2-digit"})};
var LS={
  get:function(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del:function(k){try{localStorage.removeItem(k)}catch(e){}}
};
var ICON={
  dumb:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>',
  plan:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  chart:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16M8 16v-4M12.5 16V8M17 16v-6"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
var TABS=[["train","Hoy",ICON.dumb],["plan","Plan",ICON.plan],["progress","Progreso",ICON.chart]];

/* ============================================================
   EL PLAN
   Todas las semanas están copiadas de tus videos.
   ============================================================ */

  var exs=w.exercises.map(function(ex){
    return {name:ex.name,kind:ex.kind,log:(ex.log||"").trim().slice(0,200),sets:ex.sets.filter(function(s){return s.done}).map(function(s){return {kg:num(s.kg)||0,reps:Math.round(num(s.reps)||0)}}).filter(function(s){return s.reps>0})};
  }).filter(function(ex){return ex.sets.length||ex.log});
  if(!exs.some(function(ex){return ex.sets.length})){toast("Marcá al menos una serie como hecha.");return}
  var now=Date.now();
  var sess={date:dkey(new Date(w.startedAt)),startedAt:w.startedAt,endedAt:now,week:w.week,dayId:w.dayId,routineName:w.name,
    durationMin:Math.max(1,Math.round((now-w.startedAt)/60000)),
    exercises:exs};
  sess.volume=sessVol(sess);
  var prs=computePRs(sess);
  persistSession(sess);
  S.summary={sess:sess,prs:prs,week:w.week};S.workout=null;S.timer=null;clearDraft();releaseAwake();
  S.view="summary";render();window.scrollTo(0,0);
}

var actx=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}}
function beep(){
  try{if(actx){var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.3)}}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(200)}catch(e){}
}
function startTimer(sec,label){S.timer={end:Date.now()+sec*1000,total:sec,label:label,done:false};renderDock()}
function tick(){
  if(S.workout){var el=$("#elapsed");if(el)el.textContent=elapsed(S.workout.startedAt)}
  var t=S.timer;if(!t)return;
  var left=Math.ceil((t.end-Date.now())/1000);
  if(left<=0){
    if(!t.done){t.done=true;t.doneAt=Date.now();beep();renderDock()}
    else if(Date.now()-t.doneAt>5000){S.timer=null;renderDock()}
    return;
  }
  var a=$("#tleft"),b=$("#tbar");
  if(a)a.textContent=mmss(left);
  if(b)b.style.width=Math.max(0,Math.min(100,left/t.total*100))+"%";
}

/* ---------- gráficos ---------- */
function niceScale(min,max,n){
  if(min===max){min-=1;max+=1}
  var raw=(max-min)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag;
  var step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag;
  var lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,ticks=[];
  for(var v=lo;v<=hi+step/2;v+=step)ticks.push(Math.round(v*1000)/1000);
  return {lo:lo,hi:hi,ticks:ticks};
}
function lineChart(pts,label,h,low){
  var W=340,m={l:40,r:14,t:14,b:26},iw=W-m.l-m.r,ih=h-m.t-m.b;
  var ys=pts.map(function(p){return p.y});
  var sc=niceScale(Math.min.apply(null,ys),Math.max.apply(null,ys),4);
  var t0=pts[0].t,t1=pts[pts.length-1].t;
  var X=function(t){return pts.length===1||t1===t0?m.l+iw/2:m.l+(t-t0)/(t1-t0)*iw};
  var Y=function(v){return m.t+ih-(v-sc.lo)/(sc.hi-sc.lo)*ih};
  var g="";
  sc.ticks.forEach(function(v){g+='<line class="grid" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="tx" x="'+(m.l-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+fmt(v)+'</text>'});
  var d=pts.map(function(p,i){return (i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.y).toFixed(1)}).join(" ");
  var run=low?Infinity:-Infinity,dots="";
  pts.forEach(function(p,i){
    var better=low?p.y<run:p.y>run,pr=i>0&&better;if(better)run=p.y;
    var cls="pt"+(pr?" pr":"")+(i===pts.length-1&&!pr?" last":"");
    dots+='<circle class="'+cls+'" cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(i===pts.length-1?5:3.5)+'"/>';
  });
  var xl=pts.length===1?'<text class="tx" x="'+X(t0)+'" y="'+(h-6)+'" text-anchor="middle">'+fdate(pts[0].date)+'</text>':
    '<text class="tx" x="'+m.l+'" y="'+(h-6)+'" text-anchor="start">'+fdate(pts[0].date)+'</text><text class="tx" x="'+(W-m.r)+'" y="'+(h-6)+'" text-anchor="end">'+fdate(pts[pts.length-1].date)+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+h+'" role="img" aria-label="'+esc(label)+'">'+g+(pts.length>1?'<path class="ln" d="'+d+'"/>':"")+dots+xl+'</svg>';
}
function barChart(vals,labels,label){
  var W=340,h=140,m={l:26,r:6,t:18,b:24},iw=W-m.l-m.r,ih=h-m.t-m.b;
  var top=Math.max(3,Math.max.apply(null,vals)),ticks=[0,Math.round(top/2),top].filter(function(v,i,a){return a.indexOf(v)===i});
  var Y=function(v){return m.t+ih-v/top*ih},bw=iw/vals.length,g="",b="";
  ticks.forEach(function(v){g+='<line class="grid" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="tx" x="'+(m.l-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>'});
  vals.forEach(function(v,i){
    var x=m.l+i*bw+bw*.19,w=bw*.62,y=Y(v);
    if(v>0)b+='<rect class="bar'+(i===vals.length-1?" cur":"")+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(Y(0)-y).toFixed(1)+'" rx="3"/><text class="val" x="'+(x+w/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'">'+v+'</text>';
    b+='<text class="tx" x="'+(x+w/2).toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle">'+labels[i]+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+h+'" role="img" aria-label="'+esc(label)+'">'+g+b+'</svg>';
}

  week:function(t){S.week=+t.dataset.v;S.pw=S.week;savePlan();render()},
  pw:function(t){S.pw=+t.dataset.v;render()},
  "next-week":function(){if(S.week<PLAN.maxW){S.week++;S.pw=S.week;savePlan()}S.summary=null;S.view="train";render();window.scrollTo(0,0)},
  start:function(t){startWorkout(+t.dataset.di)},
  preview:function(t){S.pv={w:S.view==="plan"?S.pw:S.week,di:+t.dataset.di,from:S.view};S.view="preview";render();window.scrollTo(0,0)},
  "pv-back":function(){S.view=S.pv.from||"train";render();window.scrollTo(0,0)},
  "pv-start":function(){if(S.pv.w!==S.week){S.week=S.pv.w;savePlan()}startWorkout(S.pv.di)},
  "plan-start":function(t){if(S.pw!==S.week){S.week=S.pw;savePlan()}startWorkout(+t.dataset.di)},
  resume:function(){S.view="workout";keepAwake();render();window.scrollTo(0,0)},
  discard:function(){S.workout=null;S.timer=null;clearDraft();releaseAwake();S.view="train";render();window.scrollTo(0,0)},
  "summary-done":function(){S.summary=null;S.view="train";render();window.scrollTo(0,0)},
  "set-done":function(t){
    unlockAudio();
    var i=+t.dataset.i,j=+t.dataset.j,ex=S.workout.exercises[i],s=ex.sets[j];
    if(!s.done){
      var r=num(s.reps);if(r==null||r<=0){toast("Cargá las repeticiones.");return}
      if(num(s.kg)==null)s.kg="0";
      s.done=true;
      var nx=ex.sets[j+1];if(nx&&!nx.done){if(!String(nx.kg).trim())nx.kg=s.kg;if(!String(nx.reps).trim())nx.reps=s.reps}
      var all=S.workout.exercises.every(function(e){return e.sets.every(function(x){return x.done})});
      var peers=ex.group?S.workout.exercises.filter(function(x){return x.group===ex.group}):[ex];
      var pend=peers.find(function(x){var y=x.sets[j];return y&&!y.done});
      if(all)S.timer=null;
      else if(pend){S.timer=null;toast("Ahora: "+pend.name)}
      else{var rs=Math.max.apply(null,peers.map(function(x){return x.rest||0}));if(rs>0)startTimer(rs,ex.group?"Superserie "+ex.group:ex.name);else S.timer=null}
    }else s.done=false;
    saveDraft();render();
    if(s.done&&ex.sets.every(function(x){return x.done})&&!(ex.group&&S.workout.exercises.some(function(x){return x.group===ex.group&&!x.sets.every(function(y){return y.done})&&x!==ex}))){
      var nxi=S.workout.exercises.findIndex(function(x){return !x.sets.every(function(y){return y.done})});
      var cards=document.querySelectorAll("section.ex");
      if(nxi>=0&&cards[nxi])setTimeout(function(){cards[nxi].scrollIntoView({behavior:"smooth",block:"start"})},250);
    }
  },
  "set-add":function(t){var ex=S.workout.exercises[+t.dataset.i],l=ex.sets[ex.sets.length-1];ex.sets.push({kg:l?l.kg:"",reps:l?l.reps:"",done:false});saveDraft();render()},
  "set-rm":function(t){var ex=S.workout.exercises[+t.dataset.i];if(ex.sets.length>1)ex.sets.pop();saveDraft();render()},
  "ex-del":function(t){S.workout.exercises.splice(+t.dataset.i,1);saveDraft();render()},
  alt:function(t){if(S.sample)runAlt(+t.dataset.i)},
  "alt-close":function(t){S.workout.exercises[+t.dataset.i].alt=null;render()},
  "alt-use":function(t){
    var i=+t.dataset.i,ex=S.workout.exercises[i],a=ex.alt.list[+t.dataset.k],old=ex.name,lx=lastFor(a.name);
    ex.name=a.name;ex.note="Reemplaza a "+old+".";ex.alt=null;ex.anc=false;ex.ref="";ex.last=lx?lx.sets:null;ex.lastLog=lx&&lx.log?lx.log:"";
    ex.sets.forEach(function(s,j){var ls=lx?lx.sets[Math.min(j,lx.sets.length-1)]:null;s.kg=ls&&ls.kg>0?kgS(ls.kg):"";if(ls)s.reps=String(ls.reps);s.done=false});
    saveDraft();render();
  },
  finish:function(){finishWorkout()},
  "t-add":function(t){if(!S.timer)return;if(S.timer.done){S.timer=null}else{S.timer.end+=(+t.dataset.v)*1000;S.timer.total=Math.max(S.timer.total,Math.ceil((S.timer.end-Date.now())/1000))}renderDock()},
  "t-skip":function(){S.timer=null;renderDock()},
  metric:function(t){S.prog.metric=t.dataset.v;render()},
  "sess-open":function(t){S.prog.open=S.prog.open===t.dataset.id?null:t.dataset.id;render()},
  "sess-del":function(t){removeSession(t.dataset.id);S.prog.open=null;render()},
  "hist-more":function(){S.prog.histN+=10;render()},
  "bw-add":function(){
    var v=num($("#bw").value);if(v==null||v<20||v>400){toast("Escribí tu peso en kilos.");return}
    var d=dkey(new Date());S.weights=S.weights.filter(function(x){return x.d!==d}).concat([{d:d,kg:Math.round(v*10)/10}]);savePlan();render();
  },
  "bw-del":function(t){S.weights=S.weights.filter(function(x){return x.d!==t.dataset.d});savePlan();render()},
  "ai-run":function(){runAI()},
  "ai-stop":function(){if(S.ai.ctl)S.ai.ctl.abort()}
};
function chain(t,field){
  var i=+t.dataset.i,j=+t.dataset.j,ex=S.workout.exercises[i],c=ex.sets[j],old=c[field],bind=field==="kg"?"w":"r";
  c[field]=t.value;
  for(var k=j+1;k<ex.sets.length;k++){
    var n=ex.sets[k];if(n.done)continue;
    if(String(n[field]).trim()===""||n[field]===old){
      n[field]=t.value;
      var el=document.querySelector('[data-bind="'+bind+'"][data-i="'+i+'"][data-j="'+k+'"]');if(el)el.value=t.value;
    }else break;
  }
  saveDraft();
}
var INP={
  w:function(t){chain(t,"kg")},
  r:function(t){chain(t,"reps")},
  xl:function(t){S.workout.exercises[+t.dataset.i].log=t.value;saveDraft()}
};
var CHG={exsel:function(t){S.prog.ex=t.value;render()}};
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t||t.disabled)return;
  if(t.dataset.confirm){
    var key=t.dataset.act+":"+(t.dataset.id||t.dataset.i||t.dataset.d||"");
    if(S.armed!==key){
      S.armed=key;var orig=t.textContent;t.textContent="¿Seguro? Tocá otra vez";t.classList.add("armed");
      setTimeout(function(){if(S.armed===key){S.armed=null;if(t.isConnected){t.textContent=orig;t.classList.remove("armed")}}},3000);
      return;
    }
    S.armed=null;
  }
  var f=ACT[t.dataset.act];if(f)f(t,e);
});
document.addEventListener("input",function(e){var t=e.target.closest("[data-bind]");if(!t)return;var f=INP[t.dataset.bind];if(f)f(t)});
document.addEventListener("change",function(e){var t=e.target.closest("[data-bind]");if(!t)return;var f=CHG[t.dataset.bind];if(f)f(t)});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&S.workout)keepAwake()});
if(typeof ResizeObserver!=="undefined"){
  new ResizeObserver(function(){document.documentElement.style.setProperty("--dock-h",$("#dock").offsetHeight+"px")}).observe($("#dock"));
}
document.addEventListener("change",function(e){
  if(!e.target||e.target.id!=="bkfile"||!e.target.files[0])return;
  var r=new FileReader();r.onload=function(){
    try{
      var o=JSON.parse(r.result);if(!o||o.app!=="plan-full-body"||!Array.isArray(o.sessions))throw 0;
      var have={};S.all.forEach(function(x){have[x.startedAt]=1});
      o.sessions.forEach(function(x){if(x&&x.startedAt&&!have[x.startedAt]){x.id="s"+x.startedAt;if(!x.plan)x.plan="busy";S.all.push(x)}});
      LS.set("fb.sessions",S.all);
      if(o.plan){var cur=S.pid;applyPlan(o.plan);usePlan(cur);savePlan()}else syncSessions();
      render();toast("Copia importada");
    }catch(err){toast("Ese archivo no es una copia válida")}
  };r.readAsText(e.target.files[0]);e.target.value="";
});
S.workout=loadDraft();
initStore();
setInterval(tick,250);
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
